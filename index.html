<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Dynamic Music Player</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    margin: 0;
    padding: 25px 10px 90px;
    background: #121212;
}

.main-container {
    width: 100%;
    max-width: 380px;
}

/* PLAYER */

.player {
    background: rgba(24,24,24,0.6);
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    text-align: center;
    width: 100%;
    border: 1px solid rgba(40,40,40,0.5);
    backdrop-filter: blur(10px);
}

#album-art {
    width: 100%;
    max-width: 280px;
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    object-fit: cover;
    margin-bottom: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}

.track-info h2 {
    margin: 10px 0 5px;
    font-size: 1.4rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.track-info p {
    margin: 0 0 25px;
    color: #b3b3b3;
    font-size: 0.9rem;
}

/* PROGRESS */

.progress-container {
    width: 100%;
    margin-bottom: 25px;
}

.progress-bar {
    width: 100%;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.2);
    outline: none;
    cursor: pointer;
}

.progress-bar::-webkit-slider-thumb {
    appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: white;
    cursor: pointer;
}

.time-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: #b3b3b3;
    margin-top: 6px;
}

/* CONTROLS */

.controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding: 0 15px;
}

.control-btn {
    background: none;
    border: none;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
}

.control-btn:active {
    transform: scale(0.9);
}

.nav-icon {
    font-size: 2.2rem;
}

#play-btn {
    background: white;
    color: black;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    font-size: 1.5rem;
}

/* PLAYLIST */

.playlist-box {
    margin-top: 18px;
    background: rgba(18,18,18,0.65);
    border-radius: 18px;
    overflow: hidden;
}

.playlist-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    cursor: pointer;
}

.playlist-header h3 {
    margin: 0;
    font-size: 1rem;
}

.playlist-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.song-count {
    color: #aaa;
    font-size: 0.75rem;
}

.playlist-arrow {
    font-size: 0.8rem;
    color: #aaa;
}

.playlist-content {
    display: none;
    padding: 0 15px 15px;
}

.playlist-content.show {
    display: block;
}

/* SEARCH */

.search-box {
    position: relative;
    margin-bottom: 12px;
}
.top-search {
    margin-bottom: 15px;
}
    
.search-box input {
    width: 100%;
    padding: 11px 38px 11px 38px;
    border: none;
    border-radius: 10px;
    background: #252525;
    color: white;
    outline: none;
    font-size: 0.85rem;
}

.search-box input::placeholder {
    color: #888;
}

.search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: #888;
}

.clear-search {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #888;
    cursor: pointer;
    display: none;
}

/* SONG LIST */

.song-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 330px;
    overflow-y: auto;
}

.song-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 10px;
    cursor: pointer;
}

.song-item:hover {
    background: rgba(255,255,255,0.08);
}

.song-item.active {
    background: rgba(255,255,255,0.13);
}

.song-item img {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 7px;
    flex-shrink: 0;
}

.song-details {
    min-width: 0;
    flex: 1;
}

.song-title {
    font-size: 0.9rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.song-artist {
    color: #aaa;
    font-size: 0.75rem;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.delete-btn {
    border: none;
    background: transparent;
    color: #aaa;
    font-size: 1rem;
    cursor: pointer;
    padding: 6px;
}

/* MANAGE */

.manage-btn {
    width: 100%;
    margin-top: 12px;
    padding: 11px;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    color: white;
    cursor: pointer;
    font-size: 0.9rem;
}

.add-panel {
    display: none;
    margin-top: 12px;
    background: rgba(10,10,10,0.7);
    padding: 15px;
    border-radius: 14px;
}

.add-panel.show {
    display: block;
}

.add-panel input {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border: none;
    border-radius: 8px;
    background: #252525;
    color: white;
    outline: none;
}

.add-panel input[type="file"] {
    font-size: 0.8rem;
}

.add-song-btn {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 9px;
    background: white;
    color: black;
    cursor: pointer;
    font-weight: 600;
}

.add-song-btn:disabled {
    opacity: 0.5;
}

.message {
    text-align: center;
    color: #aaa;
    font-size: 0.8rem;
    margin-top: 10px;
}

.loading,
.empty {
    text-align: center;
    color: #888;
    padding: 20px 5px;
    font-size: 0.85rem;
}

#audio-player {
    display: none;
}
</style>
</head>

<body>

<div class="main-container">
    
<!-- TOP SEARCH -->

<div class="search-box top-search">

    <span class="search-icon">🔍</span>

    <input
        type="text"
        id="search-input"
        placeholder="Search songs or artists..."
    >

    <button
        id="clear-search"
        class="clear-search"
    >
        ✕
    </button>

</div>


<div class="player">
    <div class="player">

        <img id="album-art" src="" alt="Album Art">

        <div class="track-info">
            <h2 id="song-title">Loading...</h2>
            <p id="song-artist">Please wait</p>
        </div>

        <div class="progress-container">

            <input
                type="range"
                id="progress-bar"
                class="progress-bar"
                min="0"
                max="100"
                value="0"
            >

            <div class="time-info">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>

        </div>

        <div class="controls">

            <button id="prev-btn" class="control-btn">
                <span class="nav-icon">⏮</span>
            </button>

            <button id="play-btn" class="control-btn">
                ▶
            </button>

            <button id="next-btn" class="control-btn">
                <span class="nav-icon">⏭</span>
            </button>

        </div>

    </div>


    <!-- PLAYLIST -->

    <div class="playlist-box">

        <div class="playlist-header" id="playlist-header">

            <h3>🎵 Playlist</h3>

            <div class="playlist-right">

                <span id="song-count" class="song-count">
                    0 songs
                </span>

                <span id="playlist-arrow" class="playlist-arrow">
                    ▼
                </span>

            </div>

        </div>


        <div id="playlist-content" class="playlist-content">

            


            <div id="song-list" class="song-list">

                <div class="loading">
                    Loading playlist...
                </div>

            </div>

        </div>

    </div>


    <!-- MANAGE PLAYLIST -->

    <button id="manage-btn" class="manage-btn">
        ⚙️ Manage Playlist
    </button>


    <div id="add-panel" class="add-panel">

        <input
            type="text"
            id="title-input"
            placeholder="Song title"
        >

        <input
            type="text"
            id="artist-input"
            placeholder="Artist"
        >

        <input
            type="file"
            id="audio-input"
            accept="audio/*"
        >

        <input
            type="file"
            id="art-input"
            accept="image/*"
        >

        <button
            id="add-song-btn"
            class="add-song-btn"
        >
            ➕ Add Song
        </button>

    </div>


    <div id="message" class="message"></div>

</div>


<audio id="audio-player"></audio>


<script>
const SUPABASE_URL =
    "https://hqrufvojjhqsmsasekkd.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_zhV1FZbc59h52dQbcN6fMQ_xBGpJ0Ig";

const { createClient } = supabase;

const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ELEMENTS

const audio = document.getElementById("audio-player");

const albumArt =
    document.getElementById("album-art");

const title =
    document.getElementById("song-title");

const artist =
    document.getElementById("song-artist");

const playBtn =
    document.getElementById("play-btn");

const prevBtn =
    document.getElementById("prev-btn");

const nextBtn =
    document.getElementById("next-btn");

const progressBar =
    document.getElementById("progress-bar");

const currentTime =
    document.getElementById("current-time");

const duration =
    document.getElementById("duration");

const playlistHeader =
    document.getElementById("playlist-header");

const playlistContent =
    document.getElementById("playlist-content");

const playlistArrow =
    document.getElementById("playlist-arrow");

const songCount =
    document.getElementById("song-count");

const songList =
    document.getElementById("song-list");

const searchInput =
    document.getElementById("search-input");

const clearSearch =
    document.getElementById("clear-search");

const manageBtn =
    document.getElementById("manage-btn");

const addPanel =
    document.getElementById("add-panel");

const titleInput =
    document.getElementById("title-input");

const artistInput =
    document.getElementById("artist-input");

const audioInput =
    document.getElementById("audio-input");

const artInput =
    document.getElementById("art-input");

const addSongBtn =
    document.getElementById("add-song-btn");

const message =
    document.getElementById("message");


let songs = [];

let currentIndex = 0;

let playlistOpen = false;

let filteredSongs = [];


// -----------------------------
// PLAYLIST OPEN / CLOSE
// -----------------------------

playlistHeader.addEventListener("click", () => {

    playlistOpen = !playlistOpen;

    playlistContent.classList.toggle(
        "show",
        playlistOpen
    );

    playlistArrow.textContent =
        playlistOpen ? "▲" : "▼";
});


// -----------------------------
// MANAGE PLAYLIST
// -----------------------------

manageBtn.addEventListener("click", () => {

    addPanel.classList.toggle("show");

});


// -----------------------------
// LOAD PLAYLIST
// -----------------------------

async function loadPlaylist() {

    songList.innerHTML =
        `<div class="loading">Loading playlist...</div>`;

    const { data, error } =
        await db
            .from("songs")
            .select("*")
            .order("created_at", {
                ascending: true
            });

    if (error) {

        console.error(error);

        songList.innerHTML =
            `<div class="empty">
                Unable to load playlist
            </div>`;

        return;
    }

    songs = data || [];

    songCount.textContent =
        `${songs.length} song${songs.length === 1 ? "" : "s"}`;

    renderPlaylist();

    if (songs.length > 0) {

        if (currentIndex >= songs.length) {
            currentIndex = 0;
        }

        loadTrack(currentIndex, false);

    } else {

        title.textContent = "No Songs";
        artist.textContent = "Add a song to your playlist";
        albumArt.src = "";

    }
}


// -----------------------------
// RENDER PLAYLIST + SEARCH
// -----------------------------

function renderPlaylist() {

    const searchText =
        searchInput.value
            .trim()
            .toLowerCase();

    filteredSongs = songs.filter(song => {

        const songTitle =
            (song.title || "").toLowerCase();

        const songArtist =
            (song.artist || "").toLowerCase();

        return (
            songTitle.includes(searchText) ||
            songArtist.includes(searchText)
        );

    });


    if (filteredSongs.length === 0) {

        songList.innerHTML =
            `<div class="empty">
                No songs found
            </div>`;

        return;
    }


    songList.innerHTML = "";


    filteredSongs.forEach(song => {

        const originalIndex =
            songs.findIndex(
                item => item.id === song.id
            );


        const item =
            document.createElement("div");

        item.className = "song-item";


        if (originalIndex === currentIndex) {
            item.classList.add("active");
        }


        item.innerHTML = `

            <img
                src="${escapeHtml(song.art_url)}"
                alt="Album"
            >

            <div class="song-details">

                <div class="song-title">
                    ${escapeHtml(song.title)}
                </div>

                <div class="song-artist">
                    ${escapeHtml(song.artist)}
                </div>

            </div>

            <button
                class="delete-btn"
                title="Delete Song"
            >
                🗑️
            </button>
        `;


        item.addEventListener("click", () => {

            loadTrack(originalIndex, true);

        });


        const deleteBtn =
            item.querySelector(".delete-btn");


        deleteBtn.addEventListener(
            "click",
            (event) => {

                event.stopPropagation();

                deleteSong(song);

            }
        );


        songList.appendChild(item);

    });
}


// -----------------------------
// SEARCH
// -----------------------------

searchInput.addEventListener(
    "input",
    () => {

        clearSearch.style.display =
            searchInput.value
                ? "block"
                : "none";

        // Open playlist when searching
        if (searchInput.value.trim()) {

            playlistOpen = true;

            playlistContent.classList.add("show");

            playlistArrow.textContent = "▲";
        }

        renderPlaylist();

    }
);


clearSearch.addEventListener(
    "click",
    () => {

        searchInput.value = "";

        clearSearch.style.display =
            "none";

        renderPlaylist();

        searchInput.focus();

    }
);


// -----------------------------
// LOAD TRACK
// -----------------------------

function loadTrack(index, shouldPlay = false) {

    if (!songs.length) return;


    currentIndex = index;

    const song = songs[currentIndex];


    title.textContent =
        song.title;

    artist.textContent =
        song.artist;

    albumArt.src =
        song.art_url;

    audio.src =
        song.audio_url;

    progressBar.value = 0;

    currentTime.textContent =
        "0:00";

    duration.textContent =
        "0:00";


    renderPlaylist();


    if (shouldPlay) {

        audio.play()
            .then(() => {

                playBtn.textContent = "❚❚";

            })
            .catch(error => {

                console.error(
                    "Playback error:",
                    error
                );

            });

    } else {

        playBtn.textContent = "▶";

    }
}


// -----------------------------
// PLAY / PAUSE
// -----------------------------

playBtn.addEventListener(
    "click",
    () => {

        if (!songs.length) return;


        if (audio.paused) {

            audio.play();

            playBtn.textContent = "❚❚";

        } else {

            audio.pause();

            playBtn.textContent = "▶";

        }

    }
);


// -----------------------------
// NEXT
// -----------------------------

nextBtn.addEventListener(
    "click",
    () => {

        if (!songs.length) return;


        currentIndex =
            (currentIndex + 1)
            % songs.length;


        loadTrack(
            currentIndex,
            true
        );

    }
);


// -----------------------------
// PREVIOUS
// -----------------------------

prevBtn.addEventListener(
    "click",
    () => {

        if (!songs.length) return;


        currentIndex =
            (currentIndex - 1 + songs.length)
            % songs.length;


        loadTrack(
            currentIndex,
            true
        );

    }
);


// -----------------------------
// SONG ENDED
// -----------------------------

audio.addEventListener(
    "ended",
    () => {

        if (!songs.length) return;


        currentIndex =
            (currentIndex + 1)
            % songs.length;


        loadTrack(
            currentIndex,
            true
        );

    }
);


// -----------------------------
// TIME UPDATE
// -----------------------------

audio.addEventListener(
    "timeupdate",
    () => {

        if (!audio.duration) return;


        const percent =
            (audio.currentTime /
             audio.duration) * 100;


        progressBar.value =
            percent;


        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


// -----------------------------
// DURATION
// -----------------------------

audio.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);


// -----------------------------
// SEEK
// -----------------------------

progressBar.addEventListener(
    "input",
    () => {

        if (!audio.duration) return;


        audio.currentTime =
            (progressBar.value / 100)
            * audio.duration;

    }
);


// -----------------------------
// ADD SONG
// -----------------------------

addSongBtn.addEventListener(
    "click",
    addSong
);


async function addSong() {

    const songTitle =
        titleInput.value.trim();

    const songArtist =
        artistInput.value.trim();

    const audioFile =
        audioInput.files[0];

    const artFile =
        artInput.files[0];


    if (
        !songTitle ||
        !songArtist ||
        !audioFile ||
        !artFile
    ) {

        showMessage(
            "Please fill everything."
        );

        return;
    }


    addSongBtn.disabled = true;

    addSongBtn.textContent =
        "Uploading...";


    try {

        const uniqueId =
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2);


        const audioPath =
            uniqueId +
            "_" +
            audioFile.name;


        const artPath =
            uniqueId +
            "_" +
            artFile.name;


        // UPLOAD AUDIO

        const audioUpload =
            await db.storage
                .from("music")
                .upload(
                    audioPath,
                    audioFile
                );


        if (audioUpload.error) {
            throw audioUpload.error;
        }


        // UPLOAD ALBUM ART

        const artUpload =
            await db.storage
                .from("album-art")
                .upload(
                    artPath,
                    artFile
                );


        if (artUpload.error) {
            throw artUpload.error;
        }


        // GET AUDIO URL

        const audioUrl =
            db.storage
                .from("music")
                .getPublicUrl(audioPath)
                .data.publicUrl;


        // GET ART URL

        const artUrl =
            db.storage
                .from("album-art")
                .getPublicUrl(artPath)
                .data.publicUrl;


        // SAVE SONG INFORMATION

        const { error } =
            await db
                .from("songs")
                .insert({

                    title: songTitle,

                    artist: songArtist,

                    audio_url: audioUrl,

                    art_url: artUrl

                });


        if (error) {
            throw error;
        }


        showMessage(
            "Song added successfully! 🎵"
        );


        titleInput.value = "";

        artistInput.value = "";

        audioInput.value = "";

        artInput.value = "";


        await loadPlaylist();


    } catch (error) {

        console.error(error);

        showMessage(
            "Something went wrong while adding the song."
        );

    }


    addSongBtn.disabled = false;

    addSongBtn.textContent =
        "➕ Add Song";
}


// -----------------------------
// DELETE SONG
// -----------------------------

async function deleteSong(song) {

    const confirmed =
        confirm(
            `Delete "${song.title}"?`
        );


    if (!confirmed) return;


    try {

        const audioPath =
            getStoragePath(
                song.audio_url,
                "music"
            );


        const artPath =
            getStoragePath(
                song.art_url,
                "album-art"
            );


        // DELETE AUDIO FILE

        if (audioPath) {

            await db.storage
                .from("music")
                .remove([
                    audioPath
                ]);

        }


        // DELETE ALBUM ART

        if (artPath) {

            await db.storage
                .from("album-art")
                .remove([
                    artPath
                ]);

        }


        // DELETE DATABASE ROW

        const { error } =
            await db
                .from("songs")
                .delete()
                .eq(
                    "id",
                    song.id
                );


        if (error) {
            throw error;
        }


        showMessage(
            "Song deleted."
        );


        await loadPlaylist();


    } catch (error) {

        console.error(error);

        showMessage(
            "Could not delete song."
        );

    }
}


// -----------------------------
// STORAGE PATH
// -----------------------------

function getStoragePath(
    url,
    bucket
) {

    if (!url) return null;


    const marker =
        `/storage/v1/object/public/${bucket}/`;


    const index =
        url.indexOf(marker);


    if (index === -1) {
        return null;
    }


    return decodeURIComponent(
        url.substring(
            index + marker.length
        )
    );

}


// -----------------------------
// FORMAT TIME
// -----------------------------

function formatTime(seconds) {

    if (
        !seconds ||
        isNaN(seconds)
    ) {
        return "0:00";
    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (
        minutes +
        ":" +
        secs
            .toString()
            .padStart(2, "0")
    );

}


// -----------------------------
// MESSAGE
// -----------------------------

function showMessage(text) {

    message.textContent =
        text;


    setTimeout(
        () => {

            message.textContent = "";

        },
        3000
    );

}


// -----------------------------
// ESCAPE HTML
// -----------------------------

function escapeHtml(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


// -----------------------------
// START
// -----------------------------

loadPlaylist();

</script>

</body>
</html>
